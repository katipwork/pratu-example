# Full stack: Postgres, Pratu v0.3.1, and this Next.js UI.
#
#   docker compose up --build
#   → UI     http://localhost:3000
#   → Pratu  http://acme.pratu.localhost:4433
#   → admin  http://localhost:4434
#
# One-time codes print to the Pratu log (dev courier):
#   docker compose logs -f pratu | grep courier

name: pratu-example

x-pratu-env: &pratu-env
  PRATU_BASE_DOMAIN: ${PRATU_BASE_DOMAIN:-pratu.localhost}
  PRATU_DATABASE_URL: postgres://pratu:pratu@postgres:5432/pratu?sslmode=disable
  PRATU_ADMIN_ROOT_KEY: ${PRATU_ADMIN_ROOT_KEY:-devroot}
  # 32+ chars each. Encrypts TOTP secrets, second-factor phones and signing keys.
  PRATU_ENCRYPTION_KEYS: ${PRATU_ENCRYPTION_KEYS:-dev-encryption-key-that-is-32-chars-long!!}
  PRATU_OAUTH2_SYSTEM_SECRET: ${PRATU_OAUTH2_SYSTEM_SECRET:-dev-oauth2-system-secret-32-chars-min!!}
  # Pratu ships no mail or SMS sender. "webhook" POSTs each message as JSON
  # and leaves delivery to you; the mailbox service below catches them and
  # shows the codes on a page. Set to "log" to print them to stdout instead.
  PRATU_COURIER_DRIVER: ${PRATU_COURIER_DRIVER:-webhook}
  PRATU_COURIER_WEBHOOK_URL: http://mailbox:8025/courier

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # The superuser stays `postgres`; the init script below creates the
      # unprivileged `pratu` role the server insists on (RLS would be inert
      # otherwise).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/devdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d pratu -c 'select 1'"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-shot: brings the schema up to date, then exits.
  migrate:
    build: &pratu-build
      context: https://github.com/katipwork/pratu.git#v0.3.1
      args:
        VERSION: v0.3.1
    image: pratu:v0.3.1
    command: ["migrate"]
    environment: *pratu-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pratu:
    build: *pratu-build
    image: pratu:v0.3.1
    command: ["serve"]
    environment: *pratu-env
    ports:
      - "${PRATU_PUBLIC_PORT:-4433}:4433"
      - "${PRATU_ADMIN_PORT:-4434}:4434"
    networks:
      default:
        aliases:
          # The app reads flows server-side, and the tenant comes from the Host
          # header — which Node's fetch cannot set. Reaching Pratu *by the
          # tenant hostname* makes the Host correct without any override.
          - ${PRATU_TENANT_HOST:-acme.pratu.localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4433/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # One-shot: creates the demo tenant. Idempotent — an existing slug is fine.
  #
  # The `ui` block is what turns browser flows into redirect-driven ones: with
  # no screens configured Pratu has nowhere to send an HTML client, so it falls
  # back to answering JSON and the 303 path is never exercised.
  bootstrap:
    image: curlimages/curl:8.11.1
    environment:
      SLUG: ${PRATU_TENANT_SLUG:-acme}
      ROOT_KEY: ${PRATU_ADMIN_ROOT_KEY:-devroot}
      ORIGIN: http://${PRATU_TENANT_HOST:-acme.pratu.localhost}:${APP_PORT:-8080}
    entrypoint: ["sh", "-c"]
    command:
      - |
        body=$$(cat <<JSON
        { "slug": "$$SLUG", "name": "Acme Inc",
          "ui": {
            "login_url":          "$$ORIGIN/login",
            "registration_url":   "$$ORIGIN/register",
            "recovery_url":       "$$ORIGIN/recovery",
            "verification_url":   "$$ORIGIN/verify",
            "error_url":          "$$ORIGIN/error",
            "default_return_url": "$$ORIGIN/dashboard"
          } }
        JSON
        )
        code=$$(curl -s -o /tmp/out -w '%{http_code}' -X POST http://pratu:4434/admin/tenants \
          -H "Authorization: Bearer $$ROOT_KEY" -H 'Content-Type: application/json' -d "$$body")
        cat /tmp/out; echo
        case "$$code" in
          2*) echo "tenant $$SLUG created with screens at $$ORIGIN" ;;
          409) echo "tenant $$SLUG already exists" ;;
          *)  echo "failed to create tenant (HTTP $$code)"; exit 1 ;;
        esac
    depends_on:
      pratu:
        condition: service_healthy
    restart: "no"

  web:
    build:
      # Root context: the Dockerfile needs the whole pnpm workspace.
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Screens read their flow server-side. Must be the tenant hostname (see
      # the alias on the pratu service), never the service name.
      PRATU_INTERNAL_URL: http://${PRATU_TENANT_HOST:-acme.pratu.localhost}:4433
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Catches courier webhooks and shows the one-time codes on a page. Dev only:
  # it displays live codes to anyone who can reach it.
  mailbox:
    image: node:22-alpine
    volumes:
      - ./docker/courier/server.mjs:/app/server.mjs:ro
    command: ["node", "/app/server.mjs"]
    ports:
      - "${MAILBOX_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The single origin the browser uses. Without it, browser flows cannot work:
  # the session and CSRF cookies are host-scoped to the tenant and there is no
  # CORS.
  caddy:
    image: caddy:2.10-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      PRATU_UPSTREAM: pratu:4433
      WEB_UPSTREAM: web:3000
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - web
      - pratu

volumes:
  pgdata:

networks:
  default:
